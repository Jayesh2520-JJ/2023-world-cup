<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Crystal CWC Archive</title>
    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --bg-color: #0a0a12;
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --secondary-accent: #3a7bd5;
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --cursor-x: 50vw;
            --cursor-y: 50vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(to bottom, rgba(10,10,18, 0.8), var(--bg-color));
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- The Background Liquid Blob --- */
        .liquid-background-blob {
            position: fixed;
            top: 0;
            left: 0;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, rgba(58, 123, 213, 0.15) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.7;
            pointer-events: none;
            transform: translate(calc(var(--cursor-x) - 50%), calc(var(--cursor-y) - 50%));
            transition: transform 1.2s cubic-bezier(0.075, 0.82, 0.165, 1);
            z-index: 0;
        }

        /* --- Header & Navigation Layout --- */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background: rgba(255, 255, 255, 0.01);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(20px) saturate(110%);
            -webkit-backdrop-filter: blur(20px) saturate(110%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Logo Styling */
        .logo-container img {
            height: 70px;
            width: auto;
            background: var(--glass-bg);
            padding: 8px; 
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 0 15px rgba(255,255,255,0.02);
            backdrop-filter: blur(15px);
            object-fit: contain;
            display: block;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.2rem;
        }

        /* --- BUTTON STYLES (Fixed Hover Effect) --- */
        .nav-link {
            position: relative;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            font-size: 1rem;
            padding: 0.9rem 1.8rem;
            border-radius: 40px;
            overflow: hidden; /* Keeps the liquid inside the button */
            display: inline-block;
            
            /* Glass Base Style */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.03);
            backdrop-filter: blur(15px);
            
            /* Smooth Transition for the "Lift" and Color change */
            transition: all 0.3s ease;
        }

        /* Ensures text stays on top of the liquid animation */
        .nav-link span {
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
        }

        /* The "Liquid Bubble" hidden inside */
        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* The blue gradient fill */
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.9), rgba(58, 123, 213, 0.9));
            z-index: 1;
            
            /* Start hidden and small */
            opacity: 0;
            transform: scale(0.5); 
            border-radius: 40px;
            
            /* Bouncy expansion effect */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- HOVER STATE (The Action) --- */
        .nav-link:hover {
            color: white;
            border-color: rgba(0, 210, 255, 0.6); /* Bright Cyan Border */
            /* Stronger Glow + Lift Up */
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4), inset 0 0 15px rgba(0, 210, 255, 0.2);
            transform: translateY(-3px); /* Moves button up */
        }

        /* Trigger the liquid bubble expansion */
        .nav-link:hover::before {
            opacity: 1;
            transform: scale(1); /* Fills the button */
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 5;
            height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.1);
            background: linear-gradient(to bottom right, #ffffff, #a8c0ff 60%, rgba(255,255,255,0.2));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.4));
        }

        /* --- Footer Styles --- */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            font-size: 0.9rem;
        }

        footer p {
            color: rgba(255, 255, 255, 0.5);
            margin: 0;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            margin-left: 10px;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
        }

        footer a:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="liquid-background-blob"></div>

    <header>
        <div class="logo-container">
            <img src="Gemini_Generated_Image_tue3kmtue3kmtue3.jpg" alt="ICC Men's Cricket World Cup India 2023">
        </div>
        
        <nav>
            <ul>
                <li><a href="#" class="nav-link"><span>Home</span></a></li>
                <li><a href="#" class="nav-link"><span>Matches</span></a></li>
                <li><a href="#" class="nav-link"><span>Teams</span></a></li>
                <li><a href="#" class="nav-link"><span>Standings</span></a></li>
                <li><a href="#" class="nav-link"><span>News</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>World Championship<br>2023</h1>
    </main>

    <footer>
        <p>
            &copy; 2026 Liquid Crystal CWC Archive. 
            <a href="terms.html">Terms & Conditions</a>
        </p>
    </footer>

    <script>
        // --- Background Blob Movement ---
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            document.documentElement.style.setProperty('--cursor-x', x + 'px');
            document.documentElement.style.setProperty('--cursor-y', y + 'px');
        });
    </script>
</body>
</html>
