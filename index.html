<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICC CWC 2023</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020204;
    --glass:rgba(30,30,35,.55);
    --border:rgba(255,255,255,.15);
    --cursor-x:50vw;
    --cursor-y:50vh;
    --c1: rgba(64,196,255,.6);
    --c2: rgba(123,31,162,.5);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
    background:var(--bg);
    font-family:"Outfit",-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

/* Cinematic background */
.bg-layer{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 30% 40%, #1b1c2a 0%, #020204 70%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 2px, transparent 2px, transparent 8px);
    z-index:-3;
}

/* Liquid glow - UPDATED */
.blob{
    position:fixed;
    width:450px;
    height:450px;
    background:radial-gradient(
        circle, 
        var(--c1), 
        var(--c2), 
        transparent 70%
    );
    border-radius:50%;
    filter:blur(80px);
    /* TRANSFORM follows cursor (fast), BACKGROUND morphs colors (slow/smooth) */
    transform:translate(calc(var(--cursor-x) - 50%), calc(var(--cursor-y) - 50%));
    transition: background 2s ease; 
    pointer-events:none;
}

/* Fluid Header */
header{
    position:fixed;
    top:24px;
    left:50%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 18px 8px 24px;
    min-width:520px;
    background:var(--glass);
    backdrop-filter:blur(40px) saturate(180%);
    border-radius:100px;
    border:1px solid var(--border);
    box-shadow: 0 4px 30px rgba(0,0,0,0.1);
    transition: 
        background 0.5s cubic-bezier(0.32, 0.72, 0, 1),
        border-color 0.5s cubic-bezier(0.32, 0.72, 0, 1),
        box-shadow 0.5s ease;
    animation: floatHeader 6s ease-in-out infinite;
}

header:hover {
    background: rgba(40, 40, 45, 0.75);
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

@keyframes floatHeader {
    0%, 100% { transform: translate(-50%, 0px); }
    50% { transform: translate(-50%, 6px); }
}

/* Logo */
.logo img{
    height:36px;
    width:auto;
    filter:
        brightness(1.25)
        contrast(1.3)
        drop-shadow(0 0 12px rgba(80,180,255,.9))
        drop-shadow(0 0 24px rgba(255,180,60,.6));
    transition:transform .6s cubic-bezier(.16,1,.3,1), filter .4s ease;
}
.logo img:hover{
    transform:scale(1.1) rotate(-2deg);
    filter:
        brightness(1.4)
        contrast(1.4)
        drop-shadow(0 0 20px rgba(120,220,255,1))
        drop-shadow(0 0 40px rgba(255,200,100,.9));
}

/* Nav */
nav ul{
    list-style:none;
    display:flex;
    gap:6px;
    background:rgba(0,0,0,.4);
    padding:6px;
    border-radius:100px;
    transition: background 0.4s ease;
}
nav ul:hover {
    background:rgba(0,0,0,.5);
}

.nav{
    padding:8px 26px;
    color:rgba(255,255,255,.6);
    text-decoration:none;
    font-size:.8rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    border-radius:100px;
    font-weight:600;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
}

.nav:hover{
    background:rgba(255,255,255,.2);
    color:#fff;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
}

.nav:active {
    transform: scale(0.95);
}

/* Hero */
main{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

@keyframes heroRise{
    from{transform:translateY(90px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

h1{
    font-size:clamp(4.5rem,11vw,11rem);
    line-height:.88;
    letter-spacing:-0.03em;
    font-weight:800;
    text-transform:uppercase;
    background:linear-gradient(180deg,#ffffff 0%,#e6e6e6 40%,#b5b5b5 60%,#ffffff 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:
        0 1px 0 rgba(255,255,255,.4),
        0 0 30px rgba(120,200,255,.35),
        0 40px 90px rgba(0,0,0,.9);
    animation:heroRise 1.4s cubic-bezier(.16,1,.3,1) forwards;
}

/* Footer */
footer{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translate(-50%,40px);
    background:rgba(20,20,25,.4);
    backdrop-filter:blur(15px);
    border:1px solid var(--border);
    border-radius:50px;
    padding:12px 30px;
    opacity:0;
    animation:foot 1.2s ease forwards .6s;
}
@keyframes foot{
    to{transform:translate(-50%,0);opacity:1}
}
footer p{
    font-size:.7rem;
    color:rgba(255,255,255,.6);
    letter-spacing: 0.02em;
}
footer a{
    color:#fff;
    text-decoration:none;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="bg-layer"></div>
<div class="blob"></div>

<header>
    <div class="logo">
        <img src="/logo.png" alt="CWC 23 Logo">
    </div>
    <nav>
        <ul>
            <li><a class="nav" href="/about">About</a></li>
            <li><a class="nav" href="/overview">Overview</a></li>
            <li><a class="nav" href="/news">News</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>World<br>Championship<br>2023</h1>
</main>

<footer>
    <p>© 2023 ICC CWC Archive. <a href="/tos">Terms & Conditions</a></p>
</footer>

<script>
    let lastColorUpdate = 0;

    document.addEventListener("mousemove", e => {
        const root = document.documentElement.style;
        const now = Date.now();
        
        // 1. Position updates INSTANTLY (no lag)
        root.setProperty("--cursor-x", e.clientX + "px");
        root.setProperty("--cursor-y", e.clientY + "px");

        // 2. Color updates THROTTLED (runs only once every 500ms)
        if (now - lastColorUpdate > 500) {
            const h1 = Math.floor(Math.random() * 360);
            const h2 = Math.floor(Math.random() * 360);
            
            root.setProperty("--c1", `hsla(${h1}, 90%, 60%, 0.6)`);
            root.setProperty("--c2", `hsla(${h2}, 90%, 50%, 0.5)`);
            
            lastColorUpdate = now;
        }
    });
</script>

</body>
</html>
